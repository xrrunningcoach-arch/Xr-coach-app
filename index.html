<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XR Running Coach — Panel de entrenamiento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ink: '#0f1412', navy: '#173933', 'navy-deep': '#0d2420', 'navy-mid': '#25534b',
            'navy-light': '#6ea393', bg: '#eef4f1', 'bg-dim': '#e2ece7',
            red: '#c1392b', 'red-deep': '#a12e22', slate: '#4a554f', mist: '#d7e3dd',
          },
          fontFamily: {
            display: ['Oswald', 'sans-serif'],
            body: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          },
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-display { font-family: 'Oswald', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-bg text-ink">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
