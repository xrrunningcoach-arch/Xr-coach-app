name: CI

# Se ejecuta en cada pull request y en cada push que no sea a main
# (en main ya lo hace el despliegue). Es gratis en repositorios públicos
# y entra en la cuota gratuita de GitHub en los privados.
on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --no-audit --no-fund

      - name: Tests (fechas, estadísticas, ciclos, plantillas, zonas, cumplimiento, traducciones)
        run: npm test

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-key
